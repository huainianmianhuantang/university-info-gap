<html lang="zh-CN">
<head>
<meta charset="UTF-8" />

<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('m985-theme'); } catch (e) { /* ignore */ }
    if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();

<style>
  :root {
    --accent: #1f5eff;
    --accent-soft: #e8efff;
    --bg: #f5f8fd;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #5b6b84;
    --border: #dbe4f2;
    --radius: 14px;
    --shadow: 0 10px 32px rgba(30, 64, 175, 0.14);
  }
  html[data-theme='dark'] {
    color-scheme: dark;
    --accent: #7ab0ff;
    --accent-soft: #1e3a6e;
    --bg: #0d1526;
    --card: #16213a;
    --text: #e5edf8;
    --muted: #9db0c8;
    --border: #2b3b57;
    --shadow: 0 10px 32px rgba(0, 0, 0, 0.45);
  }
  html[data-theme='dark'] .top {
    background: linear-gradient(135deg, #12203d, #101a2e);
    border-bottom-color: #2b3b57;
  }
  html[data-theme='dark'] .top h1 { color: #cfe0ff; }
  html[data-theme='dark'] .filters { background: rgba(13, 21, 38, 0.92); }
  html[data-theme='dark'] .panel-head {
    background: linear-gradient(135deg, #1e3a6e, transparent);
  }
  html[data-theme='dark'] .panel-head h2 { color: #cfe0ff; }
  html[data-theme='dark'] .close { background: #1e2c4a; color: #9db0c8; }
  html[data-theme='dark'] .close:hover { background: #1e3a6e; color: #cfe0ff; }
  html[data-theme='dark'] .easter { background: #1e3a6e; color: #cfe0ff; }
  html[data-theme='dark'] .flip-banner {
    background: rgba(255, 213, 128, 0.12);
    border-color: rgba(255, 213, 128, 0.3);
    color: #ffd98a;
  }
  html[data-theme='dark'] .chips span { background: #1e3a6e; color: #c7d2fe; }
  html[data-theme='dark'] .loading,
  html[data-theme='dark'] .error { background: #16213a; }
  html[data-theme='dark'] .bot-card { background: #16213a; }
  html[data-theme='dark'] .bot-head {
    background: linear-gradient(135deg, #1e2c4a, #221b3a);
    border-bottom-color: #2b3b57;
  }
  html[data-theme='dark'] .bot-head b { color: #c7d2fe; }
  html[data-theme='dark'] .bot-head div div { color: #9db0c8; }
  html[data-theme='dark'] .bot-close { color: #9db0c8; }
  html[data-theme='dark'] .bot-msgs { background: #101a2e; }
  html[data-theme='dark'] .bot-msg.bot { background: #16213a; border-color: #2b3b57; color: #e5edf8; }
  html[data-theme='dark'] .bot-school { background: #1e3a6e; border-color: #3b5b9a; color: #c7d2fe; }
  html[data-theme='dark'] .bot-school:hover { background: #6366f1; color: #fff; }
  html[data-theme='dark'] .bot-chips { background: #101a2e; }
  html[data-theme='dark'] .bot-chip { background: #16213a; border-color: #2b3b57; color: #c7d2fe; }
  html[data-theme='dark'] .bot-chip:hover { border-color: #818cf8; color: #c7d2fe; }
  html[data-theme='dark'] .bot-input-row { background: #101a2e; border-top-color: #2b3b57; }
  html[data-theme='dark'] .bot-input-row input { background: #16213a; border-color: #2b3b57; color: #e5edf8; }
  html[data-theme='dark'] .sec h4 { color: #7ab0ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .top {
    padding: 22px 22px 14px;
    text-align: center;
    background: linear-gradient(135deg, #eaf1ff, #f7fbff);
    border-bottom: 1px solid var(--border);
  }
  .top h1 { font-size: 24px; letter-spacing: 0.5px; color: #12336e; }
  .top p { margin-top: 6px; font-size: 13.5px; color: var(--muted); }
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    padding: 12px 14px;
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(245, 248, 253, 0.92);
    backdrop-filter: blur(6px);
  }
  .chip {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13.5px;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 12px rgba(31, 94, 255, 0.28);
  }
  .stat { align-self: center; font-size: 12.5px; color: var(--muted); margin-left: 6px; }
  .map-wrap {
    flex: 1;
    display: flex;
    align-items: stretch;
    justify-content: center;
    padding: 8px 14px 12px;
    min-height: 0;
  }
  .map-card {
    position: relative;
    width: 100%;
    max-width: 1180px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 4px 18px rgba(30, 64, 175, 0.06);
    overflow: hidden;
  }
  .map-card::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 18% 12%, rgba(31, 94, 255, 0.07), transparent 42%),
      radial-gradient(circle at 86% 82%, rgba(10, 165, 181, 0.07), transparent 46%),
      radial-gradient(rgba(31, 94, 255, 0.10) 1px, transparent 1.6px);
    background-size: auto, auto, 26px 26px;
  }
  #map { position: relative; z-index: 1; width: 100%; height: calc(100vh - 172px); min-height: 480px; }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    justify-content: center;
    margin-bottom: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .legend i {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 3px;
    margin-right: 5px;
    vertical-align: -1px;
  }
  .loading, .error {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--card);
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 20px;
  }
  .error b { color: #c0392b; }
  .error button {
    margin-top: 6px;
    border: 0;
    background: var(--accent);
    color: #fff;
    padding: 8px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 13px;
  }
  .foot {
    text-align: center;
    padding: 10px 14px 16px;
    font-size: 12px;
    color: var(--muted);
  }
  /* 右侧详情面板 */
  .panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(420px, 94vw);
    background: var(--card);
    box-shadow: var(--shadow);
    transform: translateX(105%);
    transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    display: flex;
    flex-direction: column;
    z-index: 60;
    border-radius: 16px 0 0 16px;
    overflow: hidden;
  }
  .panel.open { transform: translateX(0); }
  .panel-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 18px 14px;
    background: linear-gradient(135deg, var(--accent-soft), #f4f8ff);
    border-bottom: 1px solid var(--border);
  }
  .panel-emoji { font-size: 38px; }
  .panel-head h2 { font-size: 20px; color: #12336e; }
  .panel-head p { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .close {
    margin-left: auto;
    border: 0;
    background: rgba(255, 255, 255, 0.7);
    color: var(--muted);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .close:hover { background: #fff; color: var(--accent); transform: rotate(90deg); }
  .panel-body { flex: 1; overflow-y: auto; padding: 16px 18px 24px; }
  .sec { margin-bottom: 16px; }
  .sec h4 {
    font-size: 13px;
    color: var(--accent);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .sec p { font-size: 13.5px; line-height: 1.7; color: var(--text); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span {
    background: var(--accent-soft);
    color: #20449e;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .mask {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.32);
    z-index: 50;
  }
  /* 趣味：翻牌横幅 / 彩蛋 / AI 机器人 */
  .flip-banner {
    margin: -2px 0 14px;
    padding: 10px 12px;
    border-radius: 12px;
    background: linear-gradient(135deg, #fff6e0, #ffe9f3);
    border: 1px dashed #f2c66d;
    color: #8a5a00;
    font-size: 13px;
    line-height: 1.6;
  }
  .easter {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--accent-soft);
    color: #20449e;
    font-size: 12.5px;
    line-height: 1.6;
  }
  .bot-fab {
    position: fixed;
    right: 22px;
    bottom: 24px;
    z-index: 70;
    width: 52px;
    height: 52px;
    border: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    color: #fff;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(99, 102, 241, 0.4);
    transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease;
  }
  .bot-fab:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 28px rgba(99, 102, 241, 0.5);
  }
  .bot-card {
    position: fixed;
    right: 18px;
    bottom: 86px;
    z-index: 71;
    width: min(340px, calc(100vw - 28px));
    max-height: 62vh;
    display: flex;
    flex-direction: column;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 16px 44px rgba(30, 41, 59, 0.22);
    overflow: hidden;
    transform-origin: bottom right;
    animation: bot-pop 0.24s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .bot-card[hidden] { display: none; }
  @keyframes bot-pop {
    from { opacity: 0; transform: translateY(12px) scale(0.96); }
    to { opacity: 1; transform: none; }
  }
  .bot-head {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 12px 14px;
    background: linear-gradient(135deg, #eef2ff, #faf5ff);
    border-bottom: 1px solid #e5e7f5;
  }
  .bot-head b { font-size: 14px; color: #3730a3; }
  .bot-head span { font-size: 11.5px; color: #7c7f9e; }
  .bot-close {
    margin-left: auto;
    border: 0;
    background: transparent;
    color: #7c7f9e;
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
  }
  .bot-msgs {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #f8f9fe;
  }
  .bot-msg {
    max-width: 88%;
    padding: 8px 11px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.65;
    white-space: pre-wrap;
  }
  .bot-msg.bot { align-self: flex-start; background: #fff; border: 1px solid #e5e7f5; color: #1e293b; }
  .bot-msg.me { align-self: flex-end; background: #6366f1; color: #fff; }
  .bot-school {
    display: inline-block;
    margin: 4px 4px 0 0;
    border: 1px solid #c7d2fe;
    background: #eef2ff;
    color: #3730a3;
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .bot-school:hover { background: #6366f1; color: #fff; transform: translateY(-1px); }
  .bot-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px 12px 0;
    background: #f8f9fe;
  }
  .bot-chip {
    border: 1px solid #dbe0f5;
    background: #fff;
    color: #4f5596;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .bot-chip:hover { border-color: #6366f1; color: #6366f1; }
  .bot-input-row {
    display: flex;
    gap: 8px;
    padding: 10px 12px 12px;
    background: #f8f9fe;
    border-top: 1px solid #eef0f8;
  }
  .bot-input-row input {
    flex: 1;
    border: 1px solid #dbe0f5;
    border-radius: 999px;
    padding: 8px 13px;
    font-size: 13px;
    outline: none;
    background: #fff;
    color: #1e293b;
  }
  .bot-input-row button {
    border: 0;
    background: #6366f1;
    color: #fff;
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
  }
  /* 移动端：底部抽屉 */
  @media (max-width: 640px) {
    .top { padding: 16px 12px 10px; }
    .top h1 { font-size: 19px; }
    .filters { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; padding: 10px; }
    .chip { flex: 0 0 auto; }
    .stat { display: none; }
    #map { height: calc(100vh - 168px); min-height: 380px; }
    .panel {
      top: auto;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-height: 78vh;
      border-radius: 18px 18px 0 0;
      transform: translateY(105%);
    }
    .panel.open { transform: translateY(0); }
  }
</style>
</head>

      <button class="bot-close" id="botClose" type="button" aria-label="关闭">×</button>
    </div>
    <div class="bot-chips" id="botChips"></div>
    <div class="bot-msgs" id="botMsgs"></div>
    <div class="bot-input-row">
      <input id="botInput" type="text" placeholder="例如：北京有哪些985？" autocomplete="off" />
      <button id="botSend" type="button">发送</button>
    </div>
  </div>

    var nickHtml = (s.nick || s.fun)
      ? sec('🎭 学校昵称 · 冷知识', '<p><b>' + esc(s.nick || s.name) + '</b>' + (s.fun ? ' · ' + esc(s.fun) : '') + '</p>')
      : '';
    body.innerHTML = ''
      + '<div class="easter">✨ ' + esc(easter) + '</div>'
      + sec('📝 学校简介', '<p>' + esc(s.intro) + '</p>')
      + nickHtml
      + sec('🎯 培养特色', '<p>' + esc(s.feature) + '</p>')
      + sec('⭐ 优势学科', '<div class="chips">' + s.majors.map(function (m) { return '<span>' + esc(m) + '</span>'; }).join('') + '</div>')
      + sec('🏫 校园生活提示', '<p>' + esc(s.life) + '</p>')
      + sec('🎟️ 报考相关信息', '<p>' + esc(s.apply) + '</p>')
      + '<p style="font-size:11.5px;color:#9aa7bd">内容为公开资料整理，仅供信息参考，请以各校官方发布为准。</p>';
    panel.classList.add('open');
    mask.hidden = false;
    panel.setAttribute('aria-hidden', 'false');
  }
  function sec(title, html) {
    return '<section class="sec"><h4>' + title + '</h4>' + html + '</section>';
  }
  function closePanel() {
    panel.classList.remove('open');
    mask.hidden = true;
    panel.setAttribute('aria-hidden', 'true');
  }
  function openFlip() {
    var pool = currentRegion === '全部' ? SCHOOLS : SCHOOLS.filter(function (s) { return s.region === currentRegion; });
    var s = pool[Math.floor(Math.random() * pool.length)];
    openPanel(s);
    var count = 0;
    try { count = Number(localStorage.getItem('m985-flips') || '0'); } catch (e) { /* ignore */ }
    count += 1;
    try { localStorage.setItem('m985-flips', String(count)); } catch (e) { /* ignore */ }
    var fc = document.getElementById('flipCount');
    if (fc) fc.textContent = '🎲 已翻牌 ' + count + ' 次';
    var banner = document.createElement('div');
    banner.className = 'flip-banner';
    banner.textContent = '🎲 今日翻牌：' + s.emoji + ' ' + s.name + '（' + s.city + '）——缘分到了就是它！';
    var body = document.getElementById('pBody');
    if (body.firstChild) body.insertBefore(banner, body.firstChild);
    else body.appendChild(banner);
  }
  function initFlip() {
    try {
      var n = Number(localStorage.getItem('m985-flips') || '0');
      var fc = document.getElementById('flipCount');
      if (fc && n > 0) fc.textContent = '🎲 已翻牌 ' + n + ' 次';
    } catch (e) { /* ignore */ }
  }
  document.getElementById('closeBtn').addEventListener('click', closePanel);
  mask.addEventListener('click', closePanel);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closePanel();
  });

  /* ============ AI 小导游（本地规则问答） ============ */
  var BOT_ALIAS = {
    '北大':'北京大学','清华':'清华大学','人大':'中国人民大学','北航':'北京航空航天大学',
    '北理工':'北京理工大学','北理':'北京理工大学','农大':'中国农业大学','北师大':'北京师范大学',
    '民大':'中央民族大学','南开':'南开大学','天大':'天津大学','复旦':'复旦大学','上交':'上海交通大学',
    '上海交大':'上海交通大学','同济':'同济大学','华东师大':'华东师范大学','南大':'南京大学',
    '东南':'东南大学','东大':'东北大学','浙大':'浙江大学','中科大':'中国科学技术大学','科大':'中国科学技术大学',
    '厦大':'厦门大学','山大':'山东大学','海大':'中国海洋大学','武大':'武汉大学','华科':'华中科技大学',
    '华中科大':'华中科技大学','湖大':'湖南大学','中南':'中南大学','国防科大':'国防科技大学',
    '中山':'中山大学','华工':'华南理工大学','川大':'四川大学','电子科大':'电子科技大学','重大':'重庆大学',
    '西交':'西安交通大学','西交大':'西安交通大学','西工大':'西北工业大学','西农':'西北农林科技大学',
    '兰大':'兰州大学','哈工大':'哈尔滨工业大学','吉大':'吉林大学','大工':'大连理工大学'
  };
  var BOT_MAJOR_KEYWORDS = [
    { k:'计算机', words:['计算机','软件'] },
    { k:'电子信息', words:['电子','通信','集成电路','信息'] },
    { k:'工科', words:['机械','电气','自动化','材料','土木','建筑','化工','车辆','能源','交通','船舶','航空','航天','冶金'] },
    { k:'医学', words:['临床医学','口腔','药学','基础医学','公共卫生','护理'] },
    { k:'口腔', words:['口腔'] },
    { k:'经管', words:['经济','金融','工商管理','会计','管理'] },
    { k:'法学', words:['法学'] },
    { k:'人文社科', words:['中文','历史','哲学','新闻','教育','心理','外语','社会学'] },
    { k:'师范教育', words:['教育学','师范'] },
    { k:'农学', words:['农学','园艺','植物','食品','动物','林学'] },
    { k:'海洋', words:['海洋'] },
    { k:'建筑', words:['建筑'] },
    { k:'航空航天', words:['航空','航天','宇航'] },
    { k:'理科基础', words:['数学','物理','化学','生物','天文','地质','统计'] }
  ];
  var botMsgs = document.getElementById('botMsgs');
  var botInput = document.getElementById('botInput');
  var botCard = document.getElementById('botCard');
  var botFab = document.getElementById('botFab');

  function botAdd(text, who) {
    var d = document.createElement('div');
    d.className = 'bot-msg ' + who;
    d.textContent = text;
    botMsgs.appendChild(d);
    botMsgs.scrollTop = botMsgs.scrollHeight;
  }
  function botAddSchools(text, list) {
    var wrap = document.createElement('div');
    wrap.className = 'bot-msg bot';
    var p = document.createElement('div');
    p.textContent = text;
    wrap.appendChild(p);
    list.slice(0, 8).forEach(function (s) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'bot-school';
      b.textContent = s.emoji + ' ' + s.name;
      b.addEventListener('click', function () { openPanel(s); closeBot(); });
      wrap.appendChild(b);
    });
    botMsgs.appendChild(wrap);
    botMsgs.scrollTop = botMsgs.scrollHeight;
  }
  function schoolByName(text) {
    for (var key in BOT_ALIAS) {
      if (text.indexOf(key) !== -1) {
        var hit = SCHOOLS.find(function (s) { return s.name === BOT_ALIAS[key]; });
        if (hit) return hit;
      }
    }
    return SCHOOLS.find(function (s) { return text.indexOf(s.name) !== -1; }) || null;
  }
  function askBot(text) {
    var t = (text || '').trim();
    if (!t) return;
    botAdd(t, 'me');

    var s = schoolByName(t);
    if (s && /怎么样|如何|介绍|在哪|什么学校|怎么样|聊聊/.test(t)) {
      botAddSchools('这所学校的档案我熟：', [s]);
      if (s.nick) botAdd('🎭 昵称：' + s.nick);
      if (s.fun) botAdd('💡 冷知识：' + s.fun);
      botAdd('点击上面卡片即可打开完整资料库～');
      return;
    }

    var regionHit = ['华北','华东','华中','华南','西南','西北','东北'].filter(function (r) { return t.indexOf(r) !== -1; });
    if (regionHit.length) {
      var list = SCHOOLS.filter(function (x) { return x.region === regionHit[0]; });
      botAddSchools(regionHit[0] + '地区共有 ' + list.length + ' 所 985：', list);
      return;
    }

    var PROVS = ['北京','天津','上海','江苏','浙江','安徽','福建','江西','山东','湖北','湖南','河南','广东','广西','海南','四川','重庆','贵州','云南','陕西','甘肃','青海','宁夏','新疆','辽宁','吉林','黑龙江','河北','山西','内蒙古'];
    var provHit = PROVS.filter(function (p) { return t.indexOf(p) !== -1; })[0];
    if (provHit) {
      var plist = SCHOOLS.filter(function (x) { return x.province === provHit; });
      botAddSchools(provHit + '共有 ' + plist.length + ' 所 985：', plist);
      return;
    }

    for (var i = 0; i < BOT_MAJOR_KEYWORDS.length; i++) {
      var mk = BOT_MAJOR_KEYWORDS[i];
      if (mk.words.some(function (w) { return t.indexOf(w) !== -1; })) {
        var mlist = SCHOOLS.filter(function (x) {
          return mk.words.some(function (w) { return (x.majors || []).join(' ').indexOf(w) !== -1; });
        });
        if (mlist.length) {
          botAddSchools('「' + mk.k + '」方向值得关注的 985：', mlist);
          return;
        }
      }
    }

    if (t.indexOf('随机') !== -1 || t.indexOf('推荐') !== -1 || t.indexOf('翻牌') !== -1) {
      var r = SCHOOLS[Math.floor(Math.random() * SCHOOLS.length)];
      botAddSchools('帮你翻一张牌，缘分到了就是它：', [r]);
      return;
    }

    if (t.indexOf('有哪些985') !== -1 || t.indexOf('全部') !== -1 || t.indexOf('所有') !== -1 || t.indexOf('985') !== -1) {
      botAddSchools('全国共有 39 所 985（先列 8 所）：', SCHOOLS);
      return;
    }

    botAdd('这个问题我还没学会 😅 试试这些问法：');
    botAdd('· 北京有哪些985？\n· 推荐几所计算机强校\n· 口腔医学哪家强\n· 川大怎么样\n· 🎲 随机推荐一所');
  }
  function closeBot() { botCard.hidden = true; }
  function toggleBot() { botCard.hidden = !botCard.hidden; if (!botCard.hidden) botInput.focus(); }
  function initBot() {
    ['北京有哪些985？','推荐几所计算机强校','口腔医学哪家强','川大怎么样？','🎲 随机推荐一所'].forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'bot-chip';
      b.textContent = c;
      b.addEventListener('click', function () { askBot(c); });
      document.getElementById('botChips').appendChild(b);
    });
    botFab.addEventListener('click', toggleBot);
    document.getElementById('botClose').addEventListener('click', closeBot);
    document.getElementById('botSend').addEventListener('click', function () { askBot(botInput.value); botInput.value = ''; });
    botInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { askBot(botInput.value); botInput.value = ''; }
    });
    botAdd('你好呀，我是 985 地图小导游 🤖', 'bot');
    botAdd('可以问我：北京有哪些985？推荐几所计算机强校？口腔医学哪家强？川大怎么样？', 'bot');
  }

  /* ============ 启动 ============ */
  var loading = document.getElementById('loading');
  var errorBox = document.getElementById('error');
  function setStage(t) {
    loading.innerHTML = '⏳ ' + t;
  }
  function showError() {
    loading.hidden = true;
    errorBox.hidden = false;
  }
  function addPreconnects() {
    ['https://cdn.jsdelivr.net', 'https://unpkg.com', 'https://geo.datav.aliyun.com', 'https://cdnjs.cloudflare.com'].forEach(function (h) {
      if (!document.querySelector('link[rel="preconnect"][href="' + h + '"]')) {
        var l = document.createElement('link');
        l.rel = 'preconnect';
        l.href = h;
        document.head.appendChild(l);
      }
    });
  }
  var GEO_CACHE_KEY = 'm985-geo-v1';
  function loadMapData() {
    try {
      var cached = sessionStorage.getItem(GEO_CACHE_KEY);
      if (cached) {
        var j = JSON.parse(cached);
        if (j && j.features) return Promise.resolve(j);
      }
    } catch (e) { /* ignore */ }
    // 优先使用体积更小的省界精简版，DataV 全量版作为后备
    var urls = [
      'https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/json/china.json',
      'https://unpkg.com/echarts@4.9.0/map/json/china.json',
      'https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json'
    ];
    return urls.reduce(function (p, u) {
      return p.catch(function () {
        return loadJSON(u).then(function (j) {
          if (j && j.features) {
            try { sessionStorage.setItem(GEO_CACHE_KEY, JSON.stringify(j)); } catch (e) { /* ignore */ }
          }
          return j;
        });
      });
    }, Promise.reject(new Error('start')));
  }
  function loadEcharts() {
    var urls = [
      'https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js',
      'https://unpkg.com/echarts@5.5.1/dist/echarts.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.1/echarts.min.js'
    ];
    return urls.reduce(function (p, u) {
      return p.catch(function () { return loadScript(u); });
    }, Promise.reject(new Error('start')));
  }
  function boot() {
    loading.hidden = false;
    errorBox.hidden = true;
    addPreconnects();
    setStage('正在加载地图组件…');
    var pEcharts = window.echarts ? Promise.resolve() : loadEcharts();
    var pGeo = loadMapData().then(function (geo) {
      setStage('学校数据已就绪，正在绘制…');
      return geo;
    });
    Promise.all([pEcharts, pGeo])
      .then(function (res) {
        setStage('正在绘制学校点位…');
        loading.hidden = true;
        initMap(res[1]);
      })
      .catch(function (err) {
        console.error(err);
        showError();
      });
  }
  document.getElementById('retryBtn').addEventListener('click', boot);
  // 未手动选择时跟随系统深浅色（只绑定一次）
  if (!window.__m985SysBound) {
    window.__m985SysBound = true;
    var sysMq = window.matchMedia('(prefers-color-scheme: dark)');
    var onSys = function () {
      try {
        if (!localStorage.getItem('m985-theme')) setMapTheme(sysMq.matches ? 'dark' : 'light');
      } catch (e) { /* ignore */ }
    };
    if (typeof sysMq.addEventListener === 'function') sysMq.addEventListener('change', onSys);
    else if (typeof sysMq.addListener === 'function') sysMq.addListener(onSys);
  }
  buildFilters();
  buildLegend();
  initBot();
  initFlip();
  updateThemeBtn();
  boot();
})();
</script>
</body>
</html>
