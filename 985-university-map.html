<style>
  :root {
    --accent: #1f5eff;

    --card: #ffffff;
    --text: #1e293b;
    --muted: #5b6b84;
    --border: #dbe4f2;
    --radius: 14px;
    --shadow: 0 10px 32px rgba(30, 64, 175, 0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",

    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .top {
    padding: 22px 22px 14px;
    text-align: center;
    background: linear-gradient(135deg, #eaf1ff, #f7fbff);
    border-bottom: 1px solid var(--border);
  }
  .top h1 { font-size: 24px; letter-spacing: 0.5px; color: #12336e; }
  .top p { margin-top: 6px; font-size: 13.5px; color: var(--muted); }
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    padding: 12px 14px;
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(245, 248, 253, 0.92);
    backdrop-filter: blur(6px);
  }
  .chip {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13.5px;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 12px rgba(31, 94, 255, 0.28);
  }
  .stat { align-self: center; font-size: 12.5px; color: var(--muted); margin-left: 6px; }
  .map-wrap {
    flex: 1;
    display: flex;
    align-items: stretch;
    justify-content: center;
    padding: 8px 14px 12px;
    min-height: 0;
  }
  .map-card {
    position: relative;
    width: 100%;
    max-width: 1180px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 4px 18px rgba(30, 64, 175, 0.06);
    overflow: hidden;
  }
  #map { width: 100%; height: calc(100vh - 172px); min-height: 480px; }
  .loading, .error {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--card);
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 20px;
  }
  .error b { color: #c0392b; }
  .error button {
    margin-top: 6px;
    border: 0;
    background: var(--accent);
    color: #fff;
    padding: 8px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 13px;
  }
  .foot {
    text-align: center;
    padding: 10px 14px 16px;
    font-size: 12px;
    color: var(--muted);
  }
  /* 右侧详情面板 */
  .panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(420px, 94vw);
    background: var(--card);
    box-shadow: var(--shadow);
    transform: translateX(105%);

    display: flex;
    flex-direction: column;
    z-index: 60;
    border-radius: 16px 0 0 16px;
    overflow: hidden;

  .panel.open { transform: translateX(0); }
  .panel-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 18px 14px;
    background: linear-gradient(135deg, var(--accent-soft), #f4f8ff);
    border-bottom: 1px solid var(--border);

  .panel-head h2 { font-size: 20px; color: #12336e; }
  .panel-head p { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .close {
    margin-left: auto;
    border: 0;
    background: rgba(255, 255, 255, 0.7);
    color: var(--muted);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .close:hover { background: #fff; color: var(--accent); transform: rotate(90deg); }
  .panel-body { flex: 1; overflow-y: auto; padding: 16px 18px 24px; }

  .sec h4 {
    font-size: 13px;
    color: var(--accent);

    display: flex;

    background: var(--accent-soft);
    color: #20449e;
    font-size: 12px;
    padding: 4px 10px;

  }
  .mask {

    inset: 0;
    background: rgba(15, 23, 42, 0.32);

    .filters { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; padding: 10px; }

    .panel {

      right: 0;

  /* ============ 工具 ============ */
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = function () { s.remove(); reject(new Error('script fail: ' + src)); };
      document.head.appendChild(s);
    });
  }
  function loadJSON(url) {
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    });
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function symbolFor(emoji) {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">'
      + '<circle cx="20" cy="20" r="17" fill="#ffffff" fill-opacity="0.96" stroke="#1f5eff" stroke-width="2.5"/>'
      + '<circle cx="20" cy="20" r="13.5" fill="#e8efff" fill-opacity="0.7"/>'
      + '<text x="20" y="20" font-size="19" text-anchor="middle" dominant-baseline="central">' + emoji + '</text>'
      + '</svg>';
    return 'image://data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  var chart = null;
  var currentRegion = '全部';

  /* ============ 筛选按钮 ============ */
  var filterEl = document.getElementById('filters');
  var regions = ['全部', '华北', '华东', '华中', '华南', '西南', '西北', '东北'];
  function buildFilters() {
    filterEl.innerHTML = '';
    regions.forEach(function (r) {
      var b = document.createElement('button');
      b.className = 'chip' + (r === currentRegion ? ' active' : '');
      b.type = 'button';
      b.dataset.region = r;
      var n = r === '全部' ? SCHOOLS.length : SCHOOLS.filter(function (s) { return s.region === r; }).length;
      b.textContent = r + ' (' + n + ')';
      b.addEventListener('click', function () { applyFilter(r); });
      filterEl.appendChild(b);
    });
    var stat = document.createElement('span');
    stat.className = 'stat';
    stat.id = 'statCount';
    stat.textContent = '共 ' + SCHOOLS.length + ' 所';
    filterEl.appendChild(stat);
  }

  /* ============ 地图 ============ */
  function buildItems(list) {
    return list.map(function (s) {
      return {
        name: s.name,
        value: [s.lng, s.lat],
        school: s,
        symbol: symbolFor(s.emoji),
        symbolSize: 34
      };
    });
  }

  function dimRegions(region) {
    if (region === '全部') return [];
    var keep = REGION_PROVS[region] || [];
    var keepFull = keep.map(function (p) { return PROV_FULL[p]; });
    return Object.keys(PROV_FULL)
      .filter(function (p) { return keepFull.indexOf(PROV_FULL[p]) === -1; })
      .map(function (p) { return { name: PROV_FULL[p], itemStyle: { areaColor: '#eef2f8', opacity: 0.45 } }; });
  }

  function applyFilter(region) {
    currentRegion = region;
    filterEl.querySelectorAll('.chip').forEach(function (b) {
      b.classList.toggle('active', b.dataset.region === region);
    });
    var stat = document.getElementById('statCount');
    var list = region === '全部' ? SCHOOLS : SCHOOLS.filter(function (s) { return s.region === region; });
    if (stat) stat.textContent = region + ' ' + list.length + ' 所 / 共 ' + SCHOOLS.length + ' 所';
    if (chart) {
      chart.setOption({
        geo: { regions: dimRegions(region) },
        series: [{ data: buildItems(list) }]
      });
    }
  }

  function initMap(geoJson) {
    if (!window.echarts) return;
    echarts.registerMap('china', geoJson);
    chart = echarts.init(document.getElementById('map'));
    chart.setOption({
      tooltip: {
        trigger: 'item',
        backgroundColor: '#ffffff',
        borderColor: '#dbe4f2',
        textStyle: { color: '#1e293b', fontSize: 13 },
        formatter: function (p) {
          var s = p.data && p.data.school;
          if (!s) return p.name;
          return '<b>' + s.emoji + ' ' + esc(s.name) + '</b><br/>'
            + esc(s.city) + ' · ' + esc(s.region) + '<br/>'
            + '<span style="color:#5b6b84">点击查看资料库</span>';
        }
      },
      geo: {
        map: 'china',
        roam: true,
        zoom: 1.12,
        center: [104.5, 36.2],
        label: { show: false },
        itemStyle: { areaColor: '#eaf1fb', borderColor: '#b9cbea', borderWidth: 0.8 },
        emphasis: { itemStyle: { areaColor: '#d9e7ff' }, label: { show: false } },
        regions: []
      },
      series: [{
        type: 'scatter',
        coordinateSystem: 'geo',
        data: buildItems(SCHOOLS),
        symbolSize: 34,
        emphasis: { scale: 1.3 },
        itemStyle: { shadowBlur: 8, shadowColor: 'rgba(31, 94, 255, 0.35)' },
        label: { show: false },
        zlevel: 3
      }]
    });

    chart.on('click', function (params) {
      var s = params.data && params.data.school;
      if (s) openPanel(s);
    });
    chart.on('mouseout', function () {});
    window.addEventListener('resize', function () { chart && chart.resize(); });
  }

    document.getElementById('pEmoji').textContent = s.emoji;

    document.getElementById('pMeta').textContent = s.city + ' · ' + s.region + '地区 · ' + s.province;
    var body = document.getElementById('pBody');
    body.innerHTML = ''
      + sec('📝 学校简介', '<p>' + esc(s.intro) + '</p>')
      + sec('🎯 培养特色', '<p>' + esc(s.feature) + '</p>')
      + sec('⭐ 优势学科', '<div class="chips">' + s.majors.map(function (m) { return '<span>' + esc(m) + '</span>'; }).join('') + '</div>')
      + sec('🏫 校园生活提示', '<p>' + esc(s.life) + '</p>')
      + sec('🎟️ 报考相关信息', '<p>' + esc(s.apply) + '</p>')
      + '<p style="font-size:11.5px;color:#9aa7bd">内容为公开资料整理，仅供信息参考，请以各校官方发布为准。</p>';
    panel.classList.add('open');
    mask.hidden = false;
    panel.setAttribute('aria-hidden', 'false');
  }
  function sec(title, html) {
    return '<section class="sec"><h4>' + title + '</h4>' + html + '</section>';
  }
  function closePanel() {
    panel.classList.remove('open');
    mask.hidden = true;
    panel.setAttribute('aria-hidden', 'true');
  }
  document.getElementById('closeBtn').addEventListener('click', closePanel);
  mask.addEventListener('click', closePanel);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closePanel();
  });

  /* ============ 启动 ============ */
  var loading = document.getElementById('loading');
  var errorBox = document.getElementById('error');
  function showError() {
    loading.hidden = true;
    errorBox.hidden = false;
  }
  function boot() {
    loading.hidden = false;
    errorBox.hidden = true;
    var echartsUrls = [
      'https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js',
      'https://unpkg.com/echarts@5.5.1/dist/echarts.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.1/echarts.min.js'
    ];
    var geoUrls = [
      'https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json',
      'https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/json/china.json',
      'https://unpkg.com/echarts@4.9.0/map/json/china.json'
    ];
    var chain = Promise.resolve();
    if (!window.echarts) {
      chain = chain.then(function () {
        return echartsUrls.reduce(function (p, u) {
          return p.catch(function () { return loadScript(u); });
        }, Promise.reject(new Error('start')));
      });
    }
    chain
      .then(function () {
        return geoUrls.reduce(function (p, u) {
          return p.catch(function () { return loadJSON(u); });
        }, Promise.reject(new Error('start')));
      })
      .then(function (geo) {
        loading.hidden = true;
        initMap(geo);
      })
      .catch(function (err) {
        console.error(err);
        showError();
      });
  }
  document.getElementById('retryBtn').addEventListener('click', boot);
  buildFilters();
  boot();
})();
</script>
</body>
</html>
